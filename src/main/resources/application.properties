spring.application.name=tartarus


# security
spring.security.user.name=TARTARUS
spring.security.user.password=TARTARUS


#if dont use jpa remove the comment below
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.iDataSourceAutoConfiguration

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://db:5432/tartarus
spring.datasource.username=TARTARUS
spring.datasource.password=TARTARUS
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


#to ddl use only one <create | create-drop | update | validate | none>
#for help access https://hackernoon.com/using-postgres-effectively-in-spring-boot-applications
spring.jpa.hibernate.ddl-auto=none