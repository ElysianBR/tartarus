spring:
    application:
        name: tartarus

    datasource:
        driver-class-name: org.postgresql.Driver

    jpa:
        generate-ddl: true
        open-in-view: false
        properties:
            hibernate:
                default_schema: tartarus

    messages:
        basename: messages/messages

    sql:
        init:
            platform: postgresql
            schema-locations: classpath:sql/schema.sql
            mode: always



tartatus:
    jwt:
        secret: KC7M1U0fqf8gMb7w53lna8LUr5rd
        expiration-time: 86400000  #24 hours
        long-lived-expiration-time: 2592000000 #30 dias


google:
    recaptcha:
        key:
            secret: 6LeCGMApAAAAAItTQLgjEX61xnekmU2B3TkFMRCZ
            site: 6LeCGMApAAAAABXtvwasSa9Aw3oy9xSiIg7YsWSC


# Enable actuactor for swagger api
#management:
#    endpoints:
#        web:
#            exposure:
#                include: openapi, swagger-ui


server:
    servlet:
        encoding:
            charset: UTF-8
            enabled: true
            force: true


springdoc:
    api-docs:
        enabled: true
        path: /api-docs

    swagger-ui:
        enabled: true
        groups-order: asc
        operationsSorter: alpha
        path: /swagger
        tags-sorter: alpha
#    show-actuator: false