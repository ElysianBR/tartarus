version: 0.0.1

services:
  app:
    platform: linux/x86_64
    build:
      context: .
      dockerfile: Dockerfile

  db:
    image: postgres:16
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=TARTARUS
      - POSTGRES_PASSWORD=TARTARUS
      - POSTGRES_DB=TARTARUS