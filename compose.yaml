services:
  tartarus-server:
    container_name: tartarus-server
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      [ SPRING_PROFILES_ACTIVE=dev ]
    ports:
      - 8080:8080
    networks:
      - spring-cloud-network

  db:
    image: postgres:16
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=TARTARUS
      - POSTGRES_PASSWORD=TARTARUS
      - POSTGRES_DB=TARTARUS
    networks:
      - spring-cloud-network

networks:
  spring-cloud-network:
    driver: bridge